[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-verification"
version = "1.3.0"
description = "Formal verification of end-to-end steering under physically parameterized weather, characterized in CARLA"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AD Assurance Lab, Western Michigan University" }]
keywords = ["formal-verification", "autonomous-driving", "CARLA", "neural-network-verification"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# torch, torchvision, auto_LiRPA and the CARLA client wheel are NOT listed here.
# None of the four installs correctly from a plain resolver: torch needs the CUDA
# index matching the card, auto_LiRPA must come from upstream git with --no-deps,
# and CARLA ships its own wheel per interpreter version. scripts/bootstrap_env.sh
# installs all of them in the right order and then proves the result works.
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.13.0.92",
    "scipy==1.15.3",
    "matplotlib>=3.7",
    "carla-determinism @ git+https://github.com/AD-Assurance-Lab/carla-determinism--simulation--package@v1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/AD-Assurance-Lab/formal-verification--steering--code"
Dataset = "https://huggingface.co/datasets/ad-assurance-lab/steering-verification-captures"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

# Pyflakes and the pycodestyle errors, plus RUF100 so a `# noqa` that has stopped
# applying gets removed rather than accumulating. Deliberately not the stylistic
# families: this repository is a finished record, and a lint sweep that rewrites
# comments would break the paper's checker, which asserts on strings inside three
# of these files.
[tool.ruff.lint]
select = ["E", "F", "RUF100"]
# Deliberate style, not defects. Several modules import after setting an environment
# variable that the import reads (E402); the codebase uses semicolons and `l` where
# they read fine (E70x, E741). E501 is covered by line-length above.
ignore = ["E402", "E501", "E701", "E702", "E741"]
